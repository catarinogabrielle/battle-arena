<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Arena - Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/logo-los.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo-los.png">
    <link rel="apple-touch-icon" href="assets/logo-los.png">
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        #login-error {
            color: #ff3d68;
            font-size: 0.9em;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            background: rgba(255, 61, 104, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff3d68;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="game-logo">
            <img src="assets/logo-los.png" alt="Last One Standing Logo">
        </div>

        <div class="login-panel" id="main-panel">
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="********" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-button" id="btn-submit">
                    LOGIN <i class="fas fa-chevron-right button-arrow"></i>
                </button>

                <div id="login-error">Erro ao conectar!</div>
            </form>

            <div class="login-links">
                <a href="#">ESQUECEU A SENHA?</a>
            </div>
        </div>
    </div>

    <script>
        // Registro do Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => console.log('SW falhou:', err));
            });
        }

        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('login-error');

            errorDiv.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AUTENTICANDO...';
            btn.disabled = true;

            setTimeout(() => {
                const defaultName = (email.split('@')[0] || 'CATARINO').toUpperCase();
                const mockPlayer = {
                    id: "los_" + Date.now().toString(36),
                    username: defaultName,
                    email: email,
                    coins: 1250,
                    level: 15,
                    avatar: ""
                };

                localStorage.setItem('ygaming_token', 'token_' + Date.now());
                localStorage.setItem('arenaPlayerInfo', JSON.stringify(mockPlayer));

                const existingPlayer = JSON.parse(localStorage.getItem('arenaPlayer') || '{}');
                existingPlayer.nickname = defaultName;
                localStorage.setItem('arenaPlayer', JSON.stringify(existingPlayer));

                btn.innerHTML = '<i class="fas fa-check"></i> CONECTADO!';

                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 400);

            }, 600);
        });
    </script>
</body>

</html>
