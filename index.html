<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Battle Arena - Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/logo-los.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo-los.png">
    <link rel="apple-touch-icon" href="assets/logo-los.png">

    <!-- FONTES GAMER MODERNAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style-login.css">
</head>

<body>
    <div class="login-container">
        <!-- LOGO OFICIAL -->
        <div class="game-logo">
            <img src="assets/logo-los.png" alt="Last One Standing Logo">
        </div>

        <div class="login-panel" id="main-panel">
            <!-- CASO 1: SESSÃO EXISTENTE (EXIBE CARD LIMPO DE RETORNO) -->
            <div id="quick-continue-box" class="quick-continue-box" style="display: none;">
                <div class="welcome-header">
                    <span class="welcome-tag">SESSÃO ATIVA</span>
                    <h2 class="welcome-name" id="saved-player-name">CATARINOGABRIELLE</h2>
                    <p class="welcome-desc">Pronto para retornar à arena de combate?</p>
                </div>

                <a href="menu.html" class="login-button btn-quick-play" id="btn-quick-play">
                    <span>JOGAR AGORA</span> <i class="fas fa-play button-arrow"></i>
                </a>

                <button type="button" class="btn-switch-account" id="btn-show-form">
                    <i class="fas fa-user-edit"></i> Entrar com outra conta
                </button>
            </div>

            <!-- CASO 2: FORMULÁRIO DE LOGIN (EMAIL E SENHA) -->
            <div id="form-wrapper">
                <div class="panel-header">
                    <h2>ACESSO À ARENA</h2>
                    <p>Identifique seu combatente para conectar</p>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="combatente@los.arena" required autocomplete="email">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="********" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-button" id="btn-submit">
                        <span>CONECTAR</span> <i class="fas fa-arrow-right button-arrow"></i>
                    </button>

                    <div id="login-error">Erro ao autenticar!</div>
                </form>

                <div class="login-links">
                    <a href="#" id="link-forgot">ESQUECEU A SENHA?</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Registro do Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }

        // Lógica inteligente de exibição de sessão existente (apenas UM botão verde na tela!)
        try {
            const token = localStorage.getItem('ygaming_token');
            const playerInfo = JSON.parse(localStorage.getItem('arenaPlayerInfo') || '{}');
            const arenaPlayer = JSON.parse(localStorage.getItem('arenaPlayer') || '{}');
            const name = playerInfo.username || arenaPlayer.nickname;

            const quickBox = document.getElementById('quick-continue-box');
            const formWrapper = document.getElementById('form-wrapper');
            const nameEl = document.getElementById('saved-player-name');

            if (token && name && quickBox && formWrapper && nameEl) {
                nameEl.innerText = name;
                quickBox.style.display = 'flex';
                formWrapper.style.display = 'none';

                const btnSwitch = document.getElementById('btn-show-form');
                if (btnSwitch) {
                    btnSwitch.addEventListener('click', () => {
                        quickBox.style.display = 'none';
                        formWrapper.style.display = 'block';
                        const emailInput = document.getElementById('email');
                        if (emailInput) emailInput.focus();
                    });
                }
            }
        } catch (e) {}

        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('login-error');

            errorDiv.style.display = 'none';
            btn.innerHTML = '<span>AUTENTICANDO...</span> <i class="fas fa-spinner fa-spin button-arrow"></i>';
            btn.disabled = true;

            setTimeout(() => {
                const defaultName = (email.split('@')[0] || 'CATARINO').toUpperCase();
                const mockPlayer = {
                    id: "los_" + Date.now().toString(36),
                    username: defaultName,
                    email: email,
                    coins: 1250,
                    level: 15,
                    avatar: ""
                };

                localStorage.setItem('ygaming_token', 'token_' + Date.now());
                localStorage.setItem('arenaPlayerInfo', JSON.stringify(mockPlayer));

                const existingPlayer = JSON.parse(localStorage.getItem('arenaPlayer') || '{}');
                existingPlayer.nickname = defaultName;
                localStorage.setItem('arenaPlayer', JSON.stringify(existingPlayer));

                btn.innerHTML = '<span>CONECTADO!</span> <i class="fas fa-check button-arrow"></i>';

                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 350);

            }, 500);
        });
    </script>
</body>

</html>
