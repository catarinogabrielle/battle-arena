<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Battle Arena - Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/logo-los.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo-los.png">
    <link rel="apple-touch-icon" href="assets/logo-los.png">

    <!-- FONTES GAMER MODERNAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style-login.css">
    <style>
        #login-error {
            color: #ff3366;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95em;
            text-align: center;
            margin-top: 15px;
            font-weight: 700;
            display: none;
            background: rgba(255, 51, 102, 0.12);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ff3366;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <!-- SCANLINES CYBERNETICAS -->
    <div class="cyber-scanlines"></div>

    <div class="login-container">
        <div class="game-logo">
            <img src="assets/logo-los.png" alt="Last One Standing Logo">
        </div>

        <div class="login-panel" id="main-panel">
            <div class="panel-header">
                <h2>ACESSO À ARENA</h2>
                <p>Identifique seu combatente para conectar</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="combatente@los.arena" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="********" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-button" id="btn-submit">
                    <span>CONECTAR</span> <i class="fas fa-arrow-right button-arrow"></i>
                </button>

                <div id="login-error">Erro ao conectar!</div>
            </form>

            <div class="login-links">
                <a href="#">ESQUECEU A SENHA?</a>
            </div>
        </div>
    </div>

    <script>
        // Registro do Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => console.log('SW falhou:', err));
            });
        }

        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('login-error');

            errorDiv.style.display = 'none';
            btn.innerHTML = '<span>AUTENTICANDO...</span> <i class="fas fa-spinner fa-spin button-arrow"></i>';
            btn.disabled = true;

            setTimeout(() => {
                const defaultName = (email.split('@')[0] || 'CATARINO').toUpperCase();
                const mockPlayer = {
                    id: "los_" + Date.now().toString(36),
                    username: defaultName,
                    email: email,
                    coins: 1250,
                    level: 15,
                    avatar: ""
                };

                localStorage.setItem('ygaming_token', 'token_' + Date.now());
                localStorage.setItem('arenaPlayerInfo', JSON.stringify(mockPlayer));

                const existingPlayer = JSON.parse(localStorage.getItem('arenaPlayer') || '{}');
                existingPlayer.nickname = defaultName;
                localStorage.setItem('arenaPlayer', JSON.stringify(existingPlayer));

                btn.innerHTML = '<span>CONECTADO!</span> <i class="fas fa-check button-arrow"></i>';

                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 350);

            }, 500);
        });
    </script>
</body>

</html>
